[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "study-mikanos"
version = "0.1.0"
description = "Self-contained study repository and C++/Python simulator for MikanOS (Zero kara no OS Jisaku Nyumon)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*"]
